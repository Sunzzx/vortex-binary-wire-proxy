[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-binary-wire-proxy"
version = "0.2.0"
description = "High-throughput zero-copy binary wire protocol multiplexer and transparent TLS proxy with header filtering and ring-buffer connection pooling."
readme = "README.md"
authors = [{ name = "Ayush Kandwal (Sunzzx)", email = "ayushkandwal2007@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
